name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run (Monday morning), so a vulnerability disclosed in an existing dependency
    # makes the audit fail, and GitHub sends an e-mail, even when nobody pushes.
    - cron: '23 6 * * 1'
  workflow_dispatch:

# Least privilege: the jobs only read the code, and no secret is used.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA: unlike a tag, it cannot be moved to point at
      # malicious code. Dependabot keeps the SHA and the comment up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Fails if package-lock.json does not match package.json. No hook: the CI does not commit.
      - run: npm ci --ignore-scripts
      - run: npm run check
      # Bundling can fail where type-checking passes (e.g. the MediaPipe WASM copy).
      - run: npm run build
      # The end-to-end tests (npm run test:e2e) stay local: they need the installed Chrome and
      # Brave and a real video of content/dubbing, which is not in the repository.

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Checks package-lock.json against known advisories: no install needed.
      - run: npm audit

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not only the last one: also catches a secret committed with
          # --no-verify, which skips the local pre-commit hook.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact: workflow logs are readable by anyone with access to the repository.
      - run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner
